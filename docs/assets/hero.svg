<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc"><title id="title">SourceDomino — Follow the evidence upstream</title><desc id="desc">A source map shows several reports sharing one passage and citing the same original.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#cbd7d2"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#819eaa"/></marker></defs><rect width="1440" height="560" rx="20" fill="#f3f1eb"/><rect width="1440" height="560" rx="20" fill="url(#dots)"/><g transform="translate(65,53) rotate(-10 19 23)"><rect width="39" height="49" rx="5" fill="#214858"/><path d="M8 24h23" stroke="#6c929a"/><circle cx="19" cy="13" r="3" fill="#e0bf96"/><circle cx="19" cy="35" r="3" fill="#e0bf96"/></g><text x="122" y="84" fill="#223b48" font-family="Arial,sans-serif" font-size="28" font-weight="700">SourceDomino</text><text x="64" y="165" fill="#81928d" font-family="monospace" font-size="12" letter-spacing="2.4">A CITATION IS A STARTING POINT.</text><text x="60" y="242" fill="#203641" font-family="Arial,sans-serif" font-size="67" letter-spacing="-2">Six links.</text><text x="60" y="318" fill="#315f6c" font-family="Georgia,serif" font-size="65" font-style="italic">How many stories?</text><text x="64" y="372" fill="#778b8e" font-family="Arial,sans-serif" font-size="17">See citations. Inspect shared wording. Keep the uncertainty.</text><rect x="64" y="415" width="161" height="35" rx="5" fill="#e4e9e1"/><text x="81" y="438" fill="#527579" font-family="monospace" font-size="11">LOCAL WORKBENCH</text><rect x="237" y="415" width="118" height="35" rx="5" fill="#e4e9e1"/><text x="252" y="438" fill="#527579" font-family="monospace" font-size="11">NO API KEY</text><g transform="translate(786,92)"><rect width="588" height="373" rx="14" fill="#fffdf8" stroke="#cbd8d2"/><text x="24" y="35" fill="#7b9394" font-family="monospace" font-size="10" letter-spacing="2">SOURCE RELATIONSHIPS / DEMO CORPUS</text><path d="M130 248L278 139M450 248L311 139M170 271H410" stroke="#819eaa" fill="none" stroke-width="2" marker-end="url(#arr)"/><path d="M150 244Q288 165 438 244" fill="none" stroke="#caa072" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="201" y="76" width="187" height="70" rx="7" fill="#214858"/><text x="219" y="101" fill="#a6c5c6" font-family="monospace" font-size="9">EARLIEST DATED CANDIDATE</text><text x="219" y="124" fill="#fffdf7" font-family="Arial,sans-serif" font-size="14">The field report</text><rect x="41" y="239" width="187" height="70" rx="7" fill="#f2f5ed" stroke="#ced9ce"/><text x="58" y="264" fill="#8f9f95" font-family="monospace" font-size="9">SHARED WORDING</text><text x="58" y="288" fill="#355663" font-family="Arial,sans-serif" font-size="14">The wire story</text><rect x="360" y="239" width="187" height="70" rx="7" fill="#f2f5ed" stroke="#ced9ce"/><text x="377" y="264" fill="#8f9f95" font-family="monospace" font-size="9">SHARED WORDING</text><text x="377" y="288" fill="#355663" font-family="Arial,sans-serif" font-size="14">The weekly digest</text><text x="24" y="348" fill="#a3a690" font-family="Arial,sans-serif" font-size="11">A relationship is evidence to inspect, not a verdict.</text></g><text x="64" y="518" fill="#8b9b92" font-family="monospace" font-size="11" letter-spacing="1">BUILT BY UFODIA · MIT LICENSE · FOLLOW THE EVIDENCE UPSTREAM</text></svg>
